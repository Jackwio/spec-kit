# 擴充功能設定範本
# 請複製為 my-extension-config.yml，並依專案需求自訂

# 自訂：在下方新增您的設定區段

# 範例：連線設定
connection:
  # 外部服務 URL
  url: ""  # 必填：例如 "https://api.example.com"

  # API 金鑰或權杖
  api_key: ""  # 必填：您的 API 金鑰

# 範例：專案設定
project:
  # 專案識別碼
  id: ""  # 必填：例如 "my-project"

  # 工作區或組織
  workspace: ""  # 選填：例如 "my-org"

# 範例：功能旗標
features:
  # 啟用/停用主要功能
  enabled: true

  # 自動同步
  auto_sync: false

  # 詳細記錄
  verbose: false

# 範例：預設值
defaults:
  # 要套用的標籤
  labels: []  # 例如 ["automated", "spec-kit"]

  # 優先等級
  priority: "medium"  # 可選值："low"、"medium"、"high"

  # 指派人
  assignee: ""  # 選填：預設指派人

# 範例：欄位對應
# 將內部名稱對應到外部欄位 ID
field_mappings:
  # 對應範例
  # internal_field: "external_field_id"
  # status: "customfield_10001"

# 範例：進階設定
advanced:
  # 逾時秒數
  timeout: 30

  # 重試次數
  retry_count: 3

  # 快取保存秒數
  cache_duration: 3600

# 環境變數覆寫：
# 您可以使用以下格式透過環境變數覆寫任何設定：
# SPECKIT_MY_EXTENSION_{SECTION}_{KEY}
#
# 範例：
# - SPECKIT_MY_EXTENSION_CONNECTION_API_KEY：覆寫 connection.api_key
# - SPECKIT_MY_EXTENSION_PROJECT_ID：覆寫 project.id
# - SPECKIT_MY_EXTENSION_FEATURES_ENABLED：覆寫 features.enabled
#
# 注意：請使用大寫，並將句點替換為底線

# 本機覆寫：
# 本機開發時可建立 my-extension-config.local.yml（gitignore）
# 以覆寫設定而不影響團隊共用設定
